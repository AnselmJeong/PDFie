name: Release

# Builds the macOS app on an Apple Silicon runner. A pushed `v*` tag that
# matches package.json publishes a GitHub release with the DMG, the
# compressed app bundle and update.json; a manual run only uploads them
# as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Theme outputs are current
        run: bun run theme:check

      - name: Tests
        run: |
          bun run test
          bun run test:viewer

      - name: Build stable app
        run: bun run build:stable

      - name: Verify package
        run: bun run verify:package

      - name: List artifacts
        run: ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pdfie-${{ github.ref_name }}-macos-arm64
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then notes=/dev/null; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "PDFie ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --verify-tag
